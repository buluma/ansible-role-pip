---
# Remove EXTERNALLY-MANAGED file if we're on Debian12
# Related issue: https://github.com/geerlingguy/ansible-role-pip/issues/57
- name: debian12 | Find EXTERNALLY-MANAGED files
  ansible.builtin.find:
    paths: /usr/lib
    patterns: "EXTERNALLY-MANAGED"
    recurse: true
  register: externally_managed_files

- name: debian12 | Remove EXTERNALLY-MANAGED
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ externally_managed_files.files }}"
